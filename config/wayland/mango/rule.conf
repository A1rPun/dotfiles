# tags rules
tag_rule=id:1,layout_name:grid
tag_rule=id:2,layout_name:vertical_scroller
tag_rule=id:3,layout_name:vertical_scroller
tag_rule=id:4,layout_name:vertical_scroller
tag_rule=id:5,layout_name:vertical_scroller
tag_rule=id:6,layout_name:vertical_scroller
tag_rule=id:7,layout_name:vertical_scroller
tag_rule=id:8,layout_name:vertical_scroller
tag_rule=id:9,layout_name:vertical_scroller

# layer rules
# Zoom animation for launcher apps
layer_rule=animation_type_open:zoom,layer_name:wofi
layer_rule=animation_type_close:zoom,layer_name:wofi
layer_rule=animation_type_open:zoom,layer_name:launcher
layer_rule=animation_type_close:zoom,layer_name:launcher
# Slide animation for notifications
layer_rule=animation_type_open:slide,layer_name:notifications
layer_rule=animation_type_close:slide,layer_name:notifications
layer_rule=no_shadow:1,layer_name:notifications
# Prevent animations when screenshotting
layer_rule=no_blur:1,no_animation:1,layer_name:selection
layer_rule=no_blur:1,no_animation:1,layer_name:wayfreeze
